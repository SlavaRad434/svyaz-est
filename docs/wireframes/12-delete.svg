<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Подтверждение удаления" font-family="Arial, sans-serif"><rect x="0" y="0" width="360" height="760" rx="0" fill="#fff" stroke="#999"/><text x="18" y="30" font-size="18" font-weight="600" fill="#202020">СвязьЕсть</text><text x="286" y="30" font-size="12" font-weight="400" fill="#202020">Демо</text><path d="M0 52L360 52" stroke="#bbb" fill="none"/><text x="18" y="82" font-size="20" font-weight="600" fill="#202020">Подтверждение удаления</text><rect x="0" y="101" width="360" height="659" rx="0" fill="#e7e7e7" stroke="#e7e7e7"/><rect x="18" y="225" width="324" height="302" rx="8" fill="#fff" stroke="#555"/><text x="34" y="262" font-size="20" font-weight="600" fill="#202020">Удалить запись?</text><text x="34" y="300" font-size="14" font-weight="400" fill="#202020">Запись исчезнет из вашей</text><text x="34" y="321" font-size="14" font-weight="400" fill="#202020">истории. Оценка ячейки будет</text><text x="34" y="342" font-size="14" font-weight="400" fill="#202020">пересчитана.</text><a href="#10-records" aria-label="Отмена"><rect x="34" y="384" width="292" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="48" y="413" font-size="14" font-weight="600" fill="#202020">Отмена</text></a><a href="#10-records" aria-label="Удалить"><rect x="34" y="447" width="292" height="46" rx="5" fill="#252525" stroke="#252525"/><text x="48" y="476" font-size="14" font-weight="600" fill="#fff">Удалить</text></a><text x="18" y="589" font-size="13" font-weight="600" fill="#202020">Вариант для очереди:</text><text x="18" y="614" font-size="13" font-weight="400" fill="#202020">«Удалить неотправленный результат? Он</text><text x="18" y="635" font-size="13" font-weight="400" fill="#202020">не попадёт на сервер».</text></svg>
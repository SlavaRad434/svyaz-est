<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Проверка соединения" font-family="Arial, sans-serif"><rect x="0" y="0" width="360" height="760" rx="0" fill="#fff" stroke="#999"/><text x="18" y="30" font-size="18" font-weight="600" fill="#202020">СвязьЕсть</text><text x="286" y="30" font-size="12" font-weight="400" fill="#202020">Демо</text><path d="M0 52L360 52" stroke="#bbb" fill="none"/><text x="18" y="82" font-size="20" font-weight="600" fill="#202020">Проверка соединения</text><text x="18" y="124" font-size="14" font-weight="400" fill="#202020">Тест автоматически измерит скорость</text><text x="18" y="145" font-size="14" font-weight="400" fill="#202020">скачивания, отправки и задержку.</text><rect x="18" y="212" width="324" height="117" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="239" font-size="15" font-weight="600" fill="#202020">Перед запуском</text><text x="30" y="263" font-size="13" font-weight="400" fill="#202020">Время: до 30 секунд</text><text x="30" y="286" font-size="13" font-weight="400" fill="#202020">Трафик: лимит из конфигурации</text><text x="30" y="309" font-size="13" font-weight="400" fill="#202020">Для карты нужен доступ к геопозиции</text><text x="18" y="363" font-size="14" font-weight="400" fill="#202020">Вы не вошли. Замер будет сохранён без</text><text x="18" y="384" font-size="14" font-weight="400" fill="#202020">привязки к аккаунту.</text><text x="18" y="429" font-size="14" font-weight="400" fill="#202020">Разрешение геолокации запросит</text><text x="18" y="450" font-size="14" font-weight="400" fill="#202020">браузер. Заполнять данные вручную не</text><text x="18" y="471" font-size="14" font-weight="400" fill="#202020">нужно.</text><a href="#06-test-progress" aria-label="Начать тест"><rect x="18" y="542" width="324" height="46" rx="5" fill="#252525" stroke="#252525"/><text x="32" y="571" font-size="14" font-weight="600" fill="#fff">Начать тест</text></a><a href="#04-login" aria-label="Войти перед тестом"><rect x="18" y="600" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="629" font-size="14" font-weight="600" fill="#202020">Войти перед тестом</text></a><a href="#01-map" aria-label="← На карту"><rect x="18" y="696" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="725" font-size="14" font-weight="600" fill="#202020">← На карту</text></a></svg>
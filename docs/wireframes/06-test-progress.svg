<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Тест выполняется" font-family="Arial, sans-serif"><rect x="0" y="0" width="360" height="760" rx="0" fill="#fff" stroke="#999"/><text x="18" y="30" font-size="18" font-weight="600" fill="#202020">СвязьЕсть</text><text x="286" y="30" font-size="12" font-weight="400" fill="#202020">Демо</text><path d="M0 52L360 52" stroke="#bbb" fill="none"/><text x="18" y="82" font-size="20" font-weight="600" fill="#202020">Тест выполняется</text><text x="18" y="132" font-size="22" font-weight="600" fill="#202020">Скачивание</text><text x="18" y="169" font-size="14" font-weight="400" fill="#202020">Этап 2 из 3</text><rect x="18" y="195" width="324" height="12" rx="5" fill="#eee" stroke="#aaa"/><rect x="18" y="195" width="172" height="12" rx="5" fill="#777" stroke="#777"/><text x="18" y="256" font-size="13" font-weight="400" fill="#202020">Прошло</text><text x="205" y="256" font-size="14" font-weight="600" fill="#202020">12 из 30 с</text><path d="M18 268L342 268" stroke="#bbb" fill="none"/><text x="18" y="300" font-size="13" font-weight="400" fill="#202020">Трафик</text><text x="205" y="300" font-size="14" font-weight="600" fill="#202020">В пределах лимита</text><path d="M18 312L342 312" stroke="#bbb" fill="none"/><rect x="18" y="345" width="324" height="117" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="372" font-size="15" font-weight="600" fill="#202020">Данные определяются</text><text x="30" y="396" font-size="13" font-weight="400" fill="#202020">Геопозиция получена</text><text x="30" y="419" font-size="13" font-weight="400" fill="#202020">Оператор: неизвестно</text><text x="30" y="442" font-size="13" font-weight="400" fill="#202020">Сеть: неизвестно</text><text x="18" y="490" font-size="14" font-weight="400" fill="#202020">Результат сохранится автоматически. Не</text><text x="18" y="511" font-size="14" font-weight="400" fill="#202020">закрывайте вкладку.</text><a href="#05-test-start" aria-label="Отменить тест"><rect x="18" y="580" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="609" font-size="14" font-weight="600" fill="#202020">Отменить тест</text></a><text x="18" y="665" font-size="12" font-weight="400" fill="#202020">Далее: результат или событие ошибки</text></svg>
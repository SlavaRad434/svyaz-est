<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Вход в аккаунт" font-family="Arial, sans-serif"><rect x="0" y="0" width="360" height="760" rx="0" fill="#fff" stroke="#999"/><text x="18" y="30" font-size="18" font-weight="600" fill="#202020">СвязьЕсть</text><text x="286" y="30" font-size="12" font-weight="400" fill="#202020">Демо</text><path d="M0 52L360 52" stroke="#bbb" fill="none"/><text x="18" y="82" font-size="20" font-weight="600" fill="#202020">Вход в аккаунт</text><text x="18" y="126" font-size="14" font-weight="400" fill="#202020">Войдите, чтобы видеть свои записи и</text><text x="18" y="147" font-size="14" font-weight="400" fill="#202020">управлять данными аккаунта.</text><a href="#10-records" aria-label="Войти через провайдера"><rect x="18" y="208" width="324" height="46" rx="5" fill="#252525" stroke="#252525"/><text x="32" y="237" font-size="14" font-weight="600" fill="#fff">Войти через провайдера</text></a><a href="#01-map" aria-label="Продолжить без входа"><rect x="18" y="266" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="295" font-size="14" font-weight="600" fill="#202020">Продолжить без входа</text></a><rect x="18" y="348" width="324" height="71" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="375" font-size="15" font-weight="600" fill="#202020">Ожидание ответа</text><text x="30" y="399" font-size="13" font-weight="400" fill="#202020">Открывается страница провайдера…</text><rect x="18" y="462" width="324" height="71" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="489" font-size="15" font-weight="600" fill="#202020">Если вход не удался</text><text x="30" y="513" font-size="13" font-weight="400" fill="#202020">Не удалось войти. Повторите попытку.</text><a href="#04-login" aria-label="Повторить вход"><rect x="18" y="564" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="593" font-size="14" font-weight="600" fill="#202020">Повторить вход</text></a><a href="#01-map" aria-label="← На карту"><rect x="18" y="696" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="725" font-size="14" font-weight="600" fill="#202020">← На карту</text></a></svg>
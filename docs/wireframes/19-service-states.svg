<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Списки и действия" font-family="Arial, sans-serif"><rect x="0" y="0" width="360" height="760" rx="0" fill="#fff" stroke="#999"/><text x="18" y="30" font-size="18" font-weight="600" fill="#202020">СвязьЕсть</text><text x="286" y="30" font-size="12" font-weight="400" fill="#202020">Демо</text><path d="M0 52L360 52" stroke="#bbb" fill="none"/><text x="18" y="82" font-size="20" font-weight="600" fill="#202020">Списки и действия</text><rect x="18" y="110" width="324" height="94" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="137" font-size="15" font-weight="600" fill="#202020">Загрузка списка</text><text x="30" y="161" font-size="13" font-weight="400" fill="#202020">Загружаем записи…</text><text x="30" y="184" font-size="13" font-weight="400" fill="#202020">Действия временно недоступны</text><rect x="18" y="242" width="324" height="94" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="269" font-size="15" font-weight="600" fill="#202020">Список пуст</text><text x="30" y="293" font-size="13" font-weight="400" fill="#202020">У вас пока нет записей.</text><text x="30" y="316" font-size="13" font-weight="400" fill="#202020">Можно запустить первый тест.</text><rect x="18" y="374" width="324" height="94" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="401" font-size="15" font-weight="600" fill="#202020">Ошибка действия</text><text x="30" y="425" font-size="13" font-weight="400" fill="#202020">Не удалось удалить запись.</text><text x="30" y="448" font-size="13" font-weight="400" fill="#202020">Запись остаётся в списке.</text><rect x="18" y="506" width="324" height="94" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="533" font-size="15" font-weight="600" fill="#202020">Действие выполнено</text><text x="30" y="557" font-size="13" font-weight="400" fill="#202020">Запись удалена.</text><text x="30" y="580" font-size="13" font-weight="400" fill="#202020">Список обновлён.</text><a href="#10-records" aria-label="Вернуться к записям"><rect x="18" y="638" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="667" font-size="14" font-weight="600" fill="#202020">Вернуться к записям</text></a></svg>
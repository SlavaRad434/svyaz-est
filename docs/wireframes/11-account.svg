<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Настройки аккаунта" font-family="Arial, sans-serif"><rect x="0" y="0" width="360" height="760" rx="0" fill="#fff" stroke="#999"/><text x="18" y="30" font-size="18" font-weight="600" fill="#202020">СвязьЕсть</text><text x="286" y="30" font-size="12" font-weight="400" fill="#202020">Демо</text><path d="M0 52L360 52" stroke="#bbb" fill="none"/><text x="18" y="82" font-size="20" font-weight="600" fill="#202020">Настройки аккаунта</text><rect x="18" y="114" width="324" height="71" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="141" font-size="15" font-weight="600" fill="#202020">Вы вошли</text><text x="30" y="165" font-size="13" font-weight="400" fill="#202020">История связана с вашим аккаунтом.</text><a href="#10-records" aria-label="Мои записи"><rect x="18" y="244" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="273" font-size="14" font-weight="600" fill="#202020">Мои записи</text></a><a href="#01-map" aria-label="Выйти"><rect x="18" y="306" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="335" font-size="14" font-weight="600" fill="#202020">Выйти</text></a><path d="M18 393L342 393" stroke="#bbb" fill="none"/><text x="18" y="430" font-size="14" font-weight="400" fill="#202020">Удаление аккаунта удалит связанные с</text><text x="18" y="451" font-size="14" font-weight="400" fill="#202020">ним записи и изменит оценки зон.</text><a href="#12-delete" aria-label="Удалить аккаунт"><rect x="18" y="530" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="559" font-size="14" font-weight="600" fill="#202020">Удалить аккаунт</text></a><a href="#01-map" aria-label="← На карту"><rect x="18" y="696" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="725" font-size="14" font-weight="600" fill="#202020">← На карту</text></a></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Особые состояния теста" font-family="Arial, sans-serif"><rect x="0" y="0" width="360" height="760" rx="0" fill="#fff" stroke="#999"/><text x="18" y="30" font-size="18" font-weight="600" fill="#202020">СвязьЕсть</text><text x="286" y="30" font-size="12" font-weight="400" fill="#202020">Демо</text><path d="M0 52L360 52" stroke="#bbb" fill="none"/><text x="18" y="82" font-size="20" font-weight="600" fill="#202020">Особые состояния теста</text><rect x="18" y="110" width="324" height="94" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="137" font-size="15" font-weight="600" fill="#202020">Геопозиция недоступна</text><text x="30" y="161" font-size="13" font-weight="400" fill="#202020">Результат получен, но на карту</text><text x="30" y="184" font-size="13" font-weight="400" fill="#202020">не отправлен. Место неизвестно.</text><rect x="18" y="252" width="324" height="94" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="279" font-size="15" font-weight="600" fill="#202020">Не удалось подтвердить отправку</text><text x="30" y="303" font-size="13" font-weight="400" fill="#202020">Результат сохранён на устройстве.</text><text x="30" y="326" font-size="13" font-weight="400" fill="#202020">Повтор не создаст второй замер.</text><rect x="18" y="394" width="324" height="94" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="421" font-size="15" font-weight="600" fill="#202020">Замер принят и учтён</text><text x="30" y="445" font-size="13" font-weight="400" fill="#202020">Результат сохранён без аккаунта.</text><text x="30" y="468" font-size="13" font-weight="400" fill="#202020">Оценка карты будет обновлена.</text><rect x="18" y="536" width="324" height="94" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="563" font-size="15" font-weight="600" fill="#202020">Тест отменён</text><text x="30" y="587" font-size="13" font-weight="400" fill="#202020">Передача данных остановлена.</text><text x="30" y="610" font-size="13" font-weight="400" fill="#202020">Результат не опубликован.</text><a href="#05-test-start" aria-label="← К тесту"><rect x="18" y="696" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="725" font-size="14" font-weight="600" fill="#202020">← К тесту</text></a></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Как считается оценка" font-family="Arial, sans-serif"><rect x="0" y="0" width="360" height="760" rx="0" fill="#fff" stroke="#999"/><text x="18" y="30" font-size="18" font-weight="600" fill="#202020">СвязьЕсть</text><text x="286" y="30" font-size="12" font-weight="400" fill="#202020">Демо</text><path d="M0 52L360 52" stroke="#bbb" fill="none"/><text x="18" y="82" font-size="20" font-weight="600" fill="#202020">Как считается оценка</text><rect x="18" y="108" width="324" height="117" rx="5" fill="#f2f2f2" stroke="#aaa"/><text x="30" y="135" font-size="15" font-weight="600" fill="#202020">Достаточность данных</text><text x="30" y="159" font-size="13" font-weight="400" fill="#202020">От 5 замеров за 2 даты</text><text x="30" y="182" font-size="13" font-weight="400" fill="#202020">Гостевые замеры тоже учитываются</text><text x="30" y="205" font-size="13" font-weight="400" fill="#202020">Разные авторы не гарантируются</text><text x="18" y="268" font-size="17" font-weight="600" fill="#202020">Видеозвонок</text><text x="18" y="304" font-size="13" font-weight="400" fill="#202020">Скачивание</text><text x="205" y="304" font-size="14" font-weight="600" fill="#202020">от 5 Мбит/с</text><path d="M18 316L342 316" stroke="#bbb" fill="none"/><text x="18" y="346" font-size="13" font-weight="400" fill="#202020">Отправка</text><text x="205" y="346" font-size="14" font-weight="600" fill="#202020">от 3 Мбит/с</text><path d="M18 358L342 358" stroke="#bbb" fill="none"/><text x="18" y="388" font-size="13" font-weight="400" fill="#202020">Задержка</text><text x="205" y="388" font-size="14" font-weight="600" fill="#202020">до 150 мс</text><path d="M18 400L342 400" stroke="#bbb" fill="none"/><text x="18" y="434" font-size="14" font-weight="400" fill="#202020">Зелёный: прошли ≥80% взвешенной</text><text x="18" y="455" font-size="14" font-weight="400" fill="#202020">выборки. Жёлтый: от 50% до &lt;80%.</text><text x="18" y="476" font-size="14" font-weight="400" fill="#202020">Красный: менее 50%.</text><text x="18" y="516" font-size="14" font-weight="400" fill="#202020">Серый: недостаточно данных. Ошибка</text><text x="18" y="537" font-size="14" font-weight="400" fill="#202020">теста не считается нулевой скоростью.</text><text x="18" y="599" font-size="13" font-weight="400" fill="#202020">Данные за 30 дней. Старые результаты</text><text x="18" y="620" font-size="13" font-weight="400" fill="#202020">имеют меньший вес. Оценка</text><text x="18" y="641" font-size="13" font-weight="400" fill="#202020">предварительная.</text><a href="#03-card" aria-label="← Назад к карточке"><rect x="18" y="696" width="324" height="46" rx="5" fill="#fff" stroke="#252525"/><text x="32" y="725" font-size="14" font-weight="600" fill="#202020">← Назад к карточке</text></a></svg>
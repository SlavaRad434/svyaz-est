1084.872" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="142.392" cy="1084.872" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="54.785" x2="20" y2="1095.872" style="stroke:#000;stroke-width:1.5;"/><rect x="282.846" y="175.117" width="218.281" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="292.846" y="196.719" fill="#000" font-size="12" textLength="198.281">Загрузить пилотную территорию</text><text x="292.846" y="210.852" fill="#000" font-size="12" textLength="88.412">и справочники</text><rect x="303.893" y="311.648" width="176.188" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="313.893" y="333.25" fill="#000" font-size="12" textLength="133.113">Запросить оценки зон</text><text x="313.893" y="347.383" fill="#000" font-size="12" textLength="156.188">с выбранными фильтрами</text><rect x="310.839" y="688.711" width="162.295" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="320.839" y="710.313" fill="#000" font-size="12" textLength="142.295">Показать зоны на карте</text><rect x="286.414" y="796.977" width="211.145" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="296.414" y="818.578" fill="#000" font-size="12" textLength="191.145">Запросить подробную карточку</text><text x="296.414" y="832.711" fill="#000" font-size="12" textLength="127.992">с теми же фильтрами</text><path d="M535.189,929.675 L535.189,953.641 L515.189,957.641 L535.189,961.641 L535.189,985.606 A0,0 0 0 0 535.189,985.606 L818.481,985.606 A0,0 0 0 0 818.481,985.606 L818.481,939.675 L808.481,929.675 L535.189,929.675 A0,0 0 0 0 535.189,929.675" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M808.481,929.675 L808.481,939.675 L818.481,939.675 L808.481,929.675" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="541.189" y="947.243" fill="#000" font-size="13" textLength="262.292">При недостатке данных — серый статус</text><text x="541.189" y="962.554" fill="#000" font-size="13" textLength="258.921">с причиной; отсутствующие показатели</text><text x="541.189" y="977.864" fill="#000" font-size="13" textLength="150.332">не заменяются нулями.</text><rect x="268.783" y="933.508" width="246.406" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="278.783" y="955.109" fill="#000" font-size="12" textLength="226.406">Показать статус, показатели, период,</text><text x="278.783" y="969.242" fill="#000" font-size="12" textLength="225.363">число записей и ограничения оценки</text><line x1="262.783" y1="54.785" x2="262.783" y2="1095.872" style="stroke:#000;stroke-width:1.5;"/><rect x="877.81" y="379.914" width="273.289" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="887.81" y="401.516" fill="#000" font-size="12" textLength="253.289">Сформировать соответствующую выборку</text><rect x="902.565" y="434.047" width="223.777" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="912.565" y="455.648" fill="#000" font-size="12" textLength="203.777">Проверить достаточность данных</text><text x="912.565" y="469.781" fill="#000" font-size="12" textLength="103.359">для каждой зоны</text><polygon points="957.475,502.313,1071.433,502.313,1083.433,514.313,1071.433,526.313,957.475,526.313,945.475,514.313,957.475,502.313" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="957.475" y="518.47" fill="#000" font-size="11" textLength="113.958">Данных достаточно?</text><text x="932.01" y="511.992" fill="#000" font-size="11" textLength="13.465">да</text><text x="1083.433" y="511.992" fill="#000" font-size="11" textLength="18.455">нет</text><rect x="829.481" y="536.313" width="163.385" height="34.